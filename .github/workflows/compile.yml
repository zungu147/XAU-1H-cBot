name: Build GoldStraddleBot

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore GoldStraddleBot/GoldStraddleBot.csproj

      - name: Build
        run: dotnet build GoldStraddleBot/GoldStraddleBot.csproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: GoldStraddleBot
          path: GoldStraddleBot/bin/Release/net6.0/
