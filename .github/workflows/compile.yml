name: Compile cBot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create Project
        run: |
          dotnet new classlib -n GoldStraddleBot --framework net8.0 --force
          cd GoldStraddleBot
          dotnet add package cTrader.Automate

      - name: Copy cBot Source
        shell: pwsh
        run: |
          Copy-Item GoldStraddleBot.cs GoldStraddleBot/Class1.cs -Force

      - name: Build
        run: |
          cd GoldStraddleBot
          dotnet build -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Finished-cBot
          path: GoldStraddleBot/bin/Release/net8.0/GoldStraddleBot.dll
